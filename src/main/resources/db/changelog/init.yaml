databaseChangeLog:
  - changeSet:
      id: 1
      author: ilya
      changes:
        - createTable:
            tableName: pics
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: INT
