version: '3.8'

services:
  app:
    build: .
    container_name: app_container
    depends_on:
      - db
    ports:
      - '8080:8080'
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_URL: jdbc:postgresql://db:5432/dbnerzon
  db:
    image: postgres:15
    container_name: db_container_psgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbnerzon
